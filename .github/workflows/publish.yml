name: MedSCALE GitHub Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to npm from GitHub Actions'
        required: true
        default: false
        type: boolean
      create_release:
        description: 'Create GitHub Release after publish'
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

concurrency:
  group: medscale-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify and publish MedSCALE
    runs-on: ubuntu-latest
    environment: npm
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            if [[ "${TAG}" != "v${VERSION}" ]]; then
              echo "::error::Git tag ${TAG} does not match package.json version v${VERSION}"
              exit 1
            fi
          fi
          echo "package=${PACKAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Check npm published version
        id: npm_status
        if: github.event_name == 'push' || inputs.publish == true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            printf "//registry.npmjs.org/:_authToken=%s\n" "$NODE_AUTH_TOKEN" > ~/.npmrc
          fi
          PACKAGE="${{ steps.meta.outputs.package }}"
          VERSION="${{ steps.meta.outputs.version }}"
          if npm view "${PACKAGE}@${VERSION}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "${PACKAGE}@${VERSION} is already published."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "${PACKAGE}@${VERSION} is not published yet."
          fi

      - name: Verify MedSCALE release gate
        run: npm run release:medscale

      - name: Runtime dependency audit
        run: npm audit --omit=dev --registry=https://registry.npmjs.org

      - name: Publish dry run
        if: steps.npm_status.outputs.published != 'true'
        run: npm publish --dry-run --json --registry=https://registry.npmjs.org > medscale-publish-dry-run.json

      - name: Record existing publish evidence
        if: steps.npm_status.outputs.published == 'true'
        run: |
          VERIFY_ROOT="$VERIFY_ROOT" node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs'
          writeFileSync('medscale-publish-dry-run.json', JSON.stringify({
            package: '${{ steps.meta.outputs.package }}',
            version: '${{ steps.meta.outputs.version }}',
            alreadyPublished: true,
          }, null, 2))
          NODE

      - name: Pack dry run for package contents
        run: npm pack --dry-run --json --registry=https://registry.npmjs.org > medscale-pack-dry-run.json

      - name: Check publish dry-run package contents
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const dryRun = JSON.parse(readFileSync('medscale-pack-dry-run.json', 'utf8'))
          const pack = Array.isArray(dryRun) ? dryRun[0] : dryRun
          const files = new Set((pack.files ?? []).map(file => file.path))
          const required = [
            'dist/api/medscale.js',
            'target-research-platform/main.py',
            'target-research-platform/src/output/usage_envelope.py',
            'scripts/workflow/medscale-release-smoke.mjs',
            '.scale/skills.json',
            '.scale/mcp-servers.yaml',
          ]
          const missing = required.filter(path => !files.has(path))
          if (missing.length > 0) {
            throw new Error(`Publish dry-run is missing required files: ${missing.join(', ')}`)
          }
          const forbidden = [...files].filter(path =>
            path.startsWith('output/') ||
            path.startsWith('target-research-platform/output/') ||
            path.includes('__pycache__/') ||
            /\.py[cod]$/i.test(path)
          )
          if (forbidden.length > 0) {
            throw new Error(`Publish dry-run includes forbidden runtime/cache files: ${forbidden.join(', ')}`)
          }
          console.log(JSON.stringify({
            name: pack.name,
            version: pack.version,
            entryCount: pack.entryCount,
            size: pack.size,
            unpackedSize: pack.unpackedSize,
          }, null, 2))
          NODE

      - name: Upload publish dry-run evidence
        uses: actions/upload-artifact@v4
        with:
          name: medscale-publish-dry-run
          path: |
            medscale-publish-dry-run.json
            medscale-pack-dry-run.json
          retention-days: 30

      - name: Publish to npm
        if: (github.event_name == 'push' || inputs.publish == true) && steps.npm_status.outputs.published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            printf "//registry.npmjs.org/:_authToken=%s\n" "$NODE_AUTH_TOKEN" > ~/.npmrc
            echo "Using NPM_TOKEN secret for npm authentication."
          else
            if [ "${{ github.event.repository.private }}" = "true" ]; then
              echo "::error::NPM_TOKEN secret is empty. Private GitHub repositories cannot use npm provenance, and this release expects NPM_TOKEN unless npm Trusted Publishing is configured and accepted by npm for this package."
              exit 1
            fi
            echo "NPM_TOKEN is empty; npm will try npm trusted publishing via GitHub OIDC."
          fi
          PUBLISH_ARGS=(--access public --registry=https://registry.npmjs.org)
          if [ "${{ github.event.repository.private }}" = "true" ]; then
            echo "Repository is private; skipping npm provenance because npm provenance is not supported for private repositories."
          else
            PUBLISH_ARGS+=(--provenance)
          fi
          npm publish "${PUBLISH_ARGS[@]}"

      - name: Ensure npm package is public
        if: github.event_name == 'push' || inputs.publish == true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            printf "//registry.npmjs.org/:_authToken=%s\n" "$NODE_AUTH_TOKEN" > ~/.npmrc
          fi
          npm access set status=public "${{ steps.meta.outputs.package }}" --registry=https://registry.npmjs.org

      - name: Verify published npx entrypoint
        if: github.event_name == 'push' || inputs.publish == true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            printf "//registry.npmjs.org/:_authToken=%s\n" "$NODE_AUTH_TOKEN" > ~/.npmrc
          fi
          VERSION="${{ steps.meta.outputs.version }}"
          PACKAGE="${{ steps.meta.outputs.package }}"
          VERIFY_ROOT="$(mktemp -d)"
          VERIFY_WORKSPACE="${VERIFY_ROOT}/workspace"
          trap 'rm -rf "$VERIFY_ROOT"' EXIT
          mkdir -p "$VERIFY_WORKSPACE"
          for attempt in 1 2 3 4 5 6; do
            if npm exec --yes --registry=https://registry.npmjs.org --prefix "$VERIFY_ROOT" --package="${PACKAGE}@${VERSION}" -- medscale setup --dir "$VERIFY_WORKSPACE" --apply --json > "${VERIFY_ROOT}/setup-apply.json"; then
              break
            fi
            if [ "$attempt" = "6" ]; then
              echo "::error::Published npx setup --apply failed after ${attempt} attempts."
              exit 1
            fi
            sleep $((attempt * 10))
          done
          npm exec --yes --registry=https://registry.npmjs.org --prefix "$VERIFY_ROOT" --package="${PACKAGE}@${VERSION}" -- medscale doctor --dir "$VERIFY_WORKSPACE" --json > "${VERIFY_ROOT}/doctor.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const setup = JSON.parse(readFileSync(`${process.env.VERIFY_ROOT}/setup-apply.json`, 'utf8'))
          const doctor = JSON.parse(readFileSync(`${process.env.VERIFY_ROOT}/doctor.json`, 'utf8'))
          const cards = Object.fromEntries((doctor.runtimeReadiness?.cards ?? []).map(card => [card.id, card]))
          if (setup.applyReport?.ok !== true) {
            throw new Error('Published setup --apply did not report ok=true')
          }
          if ((doctor.runtimeReadiness?.requiredMissing ?? []).length > 0) {
            throw new Error(`Published doctor still reports required missing capabilities: ${doctor.runtimeReadiness.requiredMissing.join(', ')}`)
          }
          for (const id of ['medical_workflow', 'medical_retrieval', 'package_audit']) {
            if (!cards[id] || cards[id].state === 'fail') {
              throw new Error(`Published doctor card ${id} is missing or failing`)
            }
          }
          NODE

      - name: Create GitHub Release
        if: (github.event_name == 'push' || inputs.publish == true) && (github.event_name == 'push' || inputs.create_release == true)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          TITLE="MedSCALE Research OS ${TAG}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists."
          else
            gh release create "$TAG" --verify-tag --title "$TITLE" --generate-notes --latest
          fi
