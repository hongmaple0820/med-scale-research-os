# Target Intelligence DAG Workflow
# 并行执行 Phase 1-4，支持 checkpoint 恢复
#
# Usage:
#   python run_full_pipeline.py --gene EGFR --cancer-type LUAD
#   python run_full_pipeline.py --gene EGFR --cancer-type LUAD --resume  # 从 checkpoint 恢复

name: target-screening
description: 药物靶点智能筛选全流程
version: "1.0"

llm:
  provider: auto
  model: auto

# 全局参数
params:
  gene: ""           # 用户输入: 基因符号 (如 EGFR)
  cancer_type: ""    # 用户输入: TCGA 癌种 (如 LUAD)
  disease: ""        # 用户输入: 疾病名称 (如 lung adenocarcinoma)
  output_dir: ""     # 输出目录

concurrency: 5  # 最大并行步骤数

# ============================================================
# Phase 1: 表达全景与预后挖掘 (5 个并行子任务)
# ============================================================
steps:
  - id: p1_gtex
    phase: 1
    name: "GTEx 组织表达谱"
    task: "python phase1-expression/scripts/gtex_expression.py --gene {{gene}} --output-dir {{output_dir}}"
    output: gtex_data
    timeout: 120
    retry: 2

  - id: p1_protein
    phase: 1
    name: "蛋白表达验证"
    task: "python phase1-expression/scripts/hpa_validation.py --gene {{gene}} --output-dir {{output_dir}}"
    output: protein_data
    timeout: 120
    retry: 2

  - id: p1_tcga
    phase: 1
    name: "TCGA 差异表达"
    task: "python phase1-expression/scripts/tcga_analysis.py --gene {{gene}} --cancer-type {{cancer_type}} --output-dir {{output_dir}}"
    output: tcga_data
    timeout: 180
    retry: 2

  - id: p1_survival
    phase: 1
    name: "生存分析"
    task: "python phase1-expression/scripts/survival_analysis.py --gene {{gene}} --cancer-type {{cancer_type}} --output-dir {{output_dir}}"
    depends_on: [p1_tcga]
    output: survival_data
    timeout: 300
    retry: 1

  - id: p1_immune
    phase: 1
    name: "免疫微环境相关性"
    task: "python phase1-expression/scripts/immune_correlation.py --gene {{gene}} --cancer-type {{cancer_type}} --output-dir {{output_dir}}"
    depends_on: [p1_tcga]
    output: immune_data
    timeout: 180
    retry: 2

  # Phase 1 汇总 + 交叉验证
  - id: p1_validate
    phase: 1
    name: "Phase 1 交叉验证"
    task: "python shared/cross_validate_phase.py --gene {{gene}} --cancer-type {{cancer_type}} --output-dir {{output_dir}}"
    depends_on: [p1_gtex, p1_protein, p1_tcga, p1_survival, p1_immune]
    output: p1_validated
    timeout: 60
    gate:
      type: require-all-upstream
      message: "Phase 1 所有子任务必须完成才能进入验证"

  # ============================================================
  # Phase 2: 多维靶点筛选与优先级排序 (3 个并行子任务)
  # ============================================================
  - id: p2_opentargets
    phase: 2
    name: "Open Targets 靶点-疾病关联"
    task: "python phase2-screening/scripts/target_prioritization.py --gene {{gene}} --disease {{disease}} --output-dir {{output_dir}}"
    output: ot_data
    timeout: 120
    retry: 2

  - id: p2_pharos
    phase: 2
    name: "Pharos 可药性评估"
    task: "python phase2-screening/scripts/pharos_druggability.py --gene {{gene}} --output-dir {{output_dir}}"
    output: pharos_data
    timeout: 120
    retry: 2

  - id: p2_diffexpr
    phase: 2
    name: "差异表达筛选"
    task: "python phase2-screening/scripts/differential_expression.py --gene {{gene}} --cancer-type {{cancer_type}} --output-dir {{output_dir}}"
    depends_on: [p1_tcga]
    output: diffexpr_data
    timeout: 180
    retry: 2

  - id: p2_validate
    phase: 2
    name: "Phase 2 交叉验证"
    task: "python shared/cross_validate_phase.py --gene {{gene}} --phase 2 --output-dir {{output_dir}}"
    depends_on: [p2_opentargets, p2_pharos, p2_diffexpr]
    output: p2_validated
    timeout: 60

  # ============================================================
  # Phase 3: 深度调研与竞争格局 (4 个并行子任务)
  # ============================================================
  - id: p3_clinical
    phase: 3
    name: "临床试验检索"
    task: "python phase3-research/scripts/competitive_intelligence.py --gene {{gene}} --output-dir {{output_dir}}"
    output: clinical_data
    timeout: 180
    retry: 2

  - id: p3_patent
    phase: 3
    name: "专利分析"
    task: "python phase3-research/scripts/patent_landscape.py --gene {{gene}} --output-dir {{output_dir}}"
    output: patent_data
    timeout: 180
    retry: 2

  - id: p3_literature
    phase: 3
    name: "文献计量"
    task: "python phase3-research/scripts/literature_search.py --gene {{gene}} --output-dir {{output_dir}}"
    output: literature_data
    timeout: 120
    retry: 2

  - id: p3_drugs
    phase: 3
    name: "药物管线分析"
    task: "python phase3-research/scripts/drug_pipeline.py --gene {{gene}} --output-dir {{output_dir}}"
    output: drug_data
    timeout: 180
    retry: 2

  - id: p3_validate
    phase: 3
    name: "Phase 3 交叉验证"
    task: "python shared/cross_validate_phase.py --gene {{gene}} --phase 3 --output-dir {{output_dir}}"
    depends_on: [p3_clinical, p3_patent, p3_literature, p3_drugs]
    output: p3_validated
    timeout: 60

  # ============================================================
  # Phase 4: 商业计划与里程碑 (串行，依赖 Phase 1-3)
  # ============================================================
  - id: p4_business
    phase: 4
    name: "商业计划书"
    task: "python phase4-planning/scripts/business_plan.py --gene {{gene}} --report-dir {{output_dir}} --output-dir {{output_dir}}"
    depends_on: [p1_validate, p2_validate, p3_validate]
    output: business_plan
    timeout: 120
    retry: 1

  - id: p4_milestones
    phase: 4
    name: "里程碑规划"
    task: "python phase4-planning/scripts/milestone_planner.py --gene {{gene}} --report-dir {{output_dir}} --output-dir {{output_dir}}"
    depends_on: [p4_business]
    output: milestones
    timeout: 120
    retry: 1

  # ============================================================
  # Final: 报告生成与仪表板
  # ============================================================
  - id: final_report
    phase: 5
    name: "生成最终报告"
    task: "python shared/report_generator.py --gene {{gene}} --cancer-type {{cancer_type}} --output-dir {{output_dir}} --format all"
    depends_on: [p4_milestones]
    output: final_report
    timeout: 60

  - id: final_gate
    phase: 5
    name: "质量门控验证"
    gate:
      type: require-all-phases
      message: "所有 Phase 1-4 必须完成且交叉验证通过"
    depends_on: [final_report]
