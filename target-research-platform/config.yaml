# 靶点研究平台配置文件
# 所有可配置参数集中管理，便于环境切换和调优

# === 通用设置 ===
app:
  name: "靶点研究平台"
  version: "0.5.0"
  debug: false
  log_level: "INFO"           # DEBUG / INFO / WARNING / ERROR
  log_file: null              # 日志文件路径，null 表示仅控制台输出

# === API 客户端 ===
api:
  # 请求超时（秒）
  timeout: 30
  # 缓存目录
  cache_dir: "./cache"
  # 缓存有效期（秒），0 表示永不过期
  cache_ttl: 86400
  # 请求限流间隔（秒）
  rate_limit_interval: 0.34

  # NCBI E-utilities
  ncbi:
    base_url: "https://eutils.ncbi.nlm.nih.gov/entrez/eutils"
    api_key: ""               # 从 .env 文件读取，或直接填入

  # OpenTargets
  opentargets:
    graphql_url: "https://api.platform.opentargets.org/api/v4/graphql"
    rest_url: "https://api.opentargets.org/api/v4"

  # ClinicalTrials.gov
  clinicaltrials:
    base_url: "https://clinicaltrials.gov/api/v2/studies"

  # GTEx
  gtex:
    base_url: "https://gtexportal.org/rest/v1"

  # TCGA
  tcga:
    base_url: "https://api.gdc.cancer.gov"

# === Stage 1: 表达分析 ===
stage1:
  output_dir: "./output/stage1"
  # 正常组织 TPM 阈值（低于此值才算肿瘤特异性）
  normal_tissue_tpm_threshold: 10.0
  # 生存分析 p 值阈值
  survival_p_threshold: 0.05
  # 免疫相关性分析最小样本数
  immune_min_samples: 30

# === Stage 2: 靶点筛选 ===
stage2:
  output_dir: "./output/stage2"
  # GEO 数据集搜索
  geo:
    max_datasets_to_try: 5          # 最多尝试多少个数据集
    min_samples_per_group: 3        # 每组最少样本数
    prefer_rnaseq: true             # 优先 RNA-seq 数据集
  # 差异表达阈值
  de:
    # Level 1: 严格标准
    strict_adj_p: 0.05
    strict_log2fc: 1.0
    # Level 2: 宽松标准
    relaxed_adj_p: 0.2
    relaxed_log2fc: 0.5
    # Level 3: 名义标准
    nominal_p: 0.05
    nominal_log2fc: 0.3
  # 正常组织过滤
  normal_filter:
    tpm_threshold: 50              # 正常组织 TPM > 此值的基因被过滤
  # 自适应权重
  adaptive_weights:
    de_weight_min: 0.2
    de_weight_max: 0.6
    sigmoid_midpoint: 0.3
    sigmoid_steepness: 10.0
  # 成药性评估
  druggability:
    fallback_genes: ["CDK4", "CDK6", "EGFR", "BRAF", "KRAS"]
    top_n: 20

# === Stage 3: 深度研究 ===
stage3:
  output_dir: "./output/stage3"
  # 竞争格局
  competitive:
    max_trials: 100
    # 临床阶段映射
    phase_mapping:
      "APPROVAL": 4
      "PHASE_3": 3
      "PHASE_2": 2
      "PHASE_1": 1
      "PHASE_0": 0

# === Stage 4: 商业规划 ===
stage4:
  output_dir: "./output/stage4"
  # 药物开发阶段标准时间（月）
  phase_durations:
    target_validation: 12
    hit_to_lead: 12
    lead_optimization: 18
    pcc_nomination: 6
    ind_enabling: 18
    phase1: 18
    phase2: 24
    phase3: 36
    nda_submission: 12
    approval: 12
  # 成本差异化
  cost_differentiation:
    # 成药性影响早期阶段
    low_druggability_multiplier: 1.3
    high_druggability_multiplier: 0.85
    # 竞争格局影响临床阶段
    approved_drugs_multiplier: 0.9
    high_competition_multiplier: 1.15
    # 药物形式成本
    modality_cost:
      small_molecule: 1.0
      antibody: 1.3
      cell_therapy: 2.0
      gene_therapy: 2.5

# === 期刊论文 / 医学 Skills 富化 ===
manuscript:
  # LLM 深度文献评述（OpenAI 兼容 API）
  llm_api_key: ""              # OPENAI_API_KEY 或 MANUSCRIPT_LLM_API_KEY
  llm_base_url: ""             # OPENAI_BASE_URL，默认 https://api.openai.com/v1
  llm_model: "gpt-4o-mini"     # MANUSCRIPT_LLM_MODEL
  # AMiner 学术补充（引用链/期刊信号）https://open.aminer.cn/open/board
  aminer_token: ""             # AMINER_TOKEN
  enrich_pubmed: true          # PubMed efetch：摘要 + MeSH + 发表类型
  enrich_aminer: true          # AMiner 引用链（需 token）
  max_literature_papers: 12

# === Dashboard ===
dashboard:
  host: "127.0.0.1"
  port: 3012
  output_dir: "./output"
